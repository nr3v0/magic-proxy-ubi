# conf.d/10-frontends.cfg
frontend fe_http
    bind *:80
    default_backend be_app

frontend fe_https
    # Loads every PEM in the directory (bootstrap.pem at first, then certs the
    # ACME agent pushes via the Data Plane API). HAProxy selects by SNI.
    bind *:443 ssl crt /etc/haproxy/certs/
    default_backend be_app

frontend fe_stats
    bind *:8404
    # Stats-page hits (the container's own HEALTHCHECK plus any external
    # monitor polling this) are infrastructure noise, not traffic worth
    # auditing -- silence access logging for just this frontend.
    no log
    stats enable
    stats uri /stats
    stats refresh 10s
