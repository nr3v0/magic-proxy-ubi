# conf.d/10-frontends.cfg
frontend fe_http
    bind *:8080
    default_backend be_app

frontend fe_https
    # Loads every PEM in the directory (bootstrap.pem at first, then certs the
    # ACME agent pushes via the Data Plane API). HAProxy selects by SNI.
    bind *:8443 ssl crt /etc/haproxy/certs/
    default_backend be_app

frontend fe_stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
