config_version: 2
name: haproxy-ubi10-single-container

dataplaneapi:
  host: "0.0.0.0"
  port: 5555
  scheme:
    - http
  socket_path: "/run/dataplaneapi.sock"
  cleanup_timeout: "10s"
  graceful_timeout: "15s"
  max_header_size: "1MiB"
  keep_alive: "3m"
  read_timeout: "30s"
  write_timeout: "60s"
  show_system_info: true

  userlist:
    userlist: "dataplaneapi"

  transaction:
    transaction_dir: "/tmp/haproxy-transactions"
    backups_number: 5
    backups_dir: "/etc/haproxy/backups"
    max_open_transactions: 20

  resources:
    maps_dir: "/etc/haproxy/maps"
    ssl_certs_dir: "/etc/haproxy/certs"
    spoe_dir: "/etc/haproxy/spoe"
    spoe_transaction_dir: "/tmp/spoe-haproxy"
    dataplane_storage_dir: "/etc/haproxy/dataplane-storage"
    update_map_files: true
    update_map_files_period: 10

haproxy:
  config_file: "/etc/haproxy/haproxy.cfg"
  haproxy_bin: "/usr/sbin/haproxy"
  reload:
    reload_cmd: "/usr/local/bin/haproxy-reload.sh"
    restart_cmd: "/usr/local/bin/haproxy-reload.sh"
    status_cmd: ""
    service_name: "haproxy"
    reload_retention: 7
    reload_strategy: custom

log_targets:
  - log_to: stdout
    log_level: info
    log_format: text
    log_types:
      - app
      - access
