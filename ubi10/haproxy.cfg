# haproxy.cfg
global
    log stdout format raw local0
    pidfile /var/lib/haproxy/haproxy.pid
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

userlist dataplaneapi
    user admin insecure-password change-me
