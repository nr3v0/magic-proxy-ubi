# haproxy.cfg
global
    log stdout format raw local0
    pidfile /var/lib/haproxy/haproxy.pid
    # This is the real runtime API socket the Data Plane API talks to -- not
    # the same as /run/haproxy/admin.sock, which is a separate socket the
    # entrypoint script passes via `haproxy -S` purely to poll for startup
    # readiness (see container-entrypoint-dataplane.sh).
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

userlist dataplaneapi
    user admin insecure-password change-me
